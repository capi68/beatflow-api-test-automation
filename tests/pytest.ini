[pytest]
testpaths = .
python_files = test_*.py
python_functions = test_*
python_classes = Test*
addopts = -v --tb=short --alluredir=allure-results
markers =
    smoke: Quick tests for basic functionality
    regression: Full regression test suite
    artist: Test related to artist entity
    album: Test related to album entity
    listener: Test related to listener entity
    subscription: Test related to subscription entity
    track: Test related to track entity
    playlist: Test related to playlist entity
    playlist_track: Test related to playlist tracks entity
    stream: Test related to stream entity
    royalty: Test related to royalty entity
    license: Test related to license entity
    prueba: Test pruebas.